<div class="container my-5">
  <h2 class="text-center mb-4 fw-bold">Find Your Bike Insurance Type</h2>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let bike of bikeTypes">
      <div class="card h-100 shadow-sm p-3 border-0 text-center type-card fade-in-up" style="cursor: pointer;">
        <div class="icon-circle">🏍️</div>
        <h5 class="fw-bold mt-2">{{ bike.name }}</h5>
        <p class="text-muted">{{ bike.desc }}</p>
        <button class="btn btn-outline-primary btn-sm mt-auto" (click)="openModal(bike)">Explore</button>
      </div>
    </div>
  </div>

  <!-- MODAL POPUP -->
  <div class="modal-overlay" *ngIf="selectedBike" (click)="closeModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h4>{{ selectedBike.name }} Insurance Details</h4>
        <button class="close-btn" (click)="closeModal()">×</button>
      </div>
      <div class="modal-content">
        <p><strong>Overview:</strong> {{ selectedBike.overview }}</p>
        <p><strong>Premium Range:</strong> {{ selectedBike.premiumRange }}</p>
        <p><strong>Coverage:</strong> {{ selectedBike.coverage }}</p>
      </div>
    </div>
  </div>
</div>
