<div class="container mt-5">
    <div class="card shadow p-4 border-0 rounded-4">
      <h3 class="fw-bold text-center mb-4 text-primary">Step 3: Motorcycle Information</h3>
  
      <form>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Bike Make</label>
            <select class="form-select">
              <option selected disabled>Select Make</option>
              <option>Honda</option>
              <option>Yamaha</option>
              <option>TVS</option>
              <option>Bajaj</option>
              <option>Royal Enfield</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Bike Model</label>
            <input type="text" class="form-control" placeholder="Ex: Pulsar 150">
          </div>
        </div>
  
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Year of Manufacture</label>
            <input type="number" class="form-control" placeholder="e.g., 2020">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Registration Number</label>
            <input type="text" class="form-control" placeholder="MH12AB1234">
          </div>
        </div>
  
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Engine Capacity (CC)</label>
            <select class="form-select">
              <option selected disabled>Select</option>
              <option>Below 75cc</option>
              <option>75cc - 150cc</option>
              <option>150cc - 350cc</option>
              <option>Above 350cc</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Fuel Type</label>
            <select class="form-select">
              <option selected disabled>Select</option>
              <option>Petrol</option>
              <option>Electric</option>
              <option>Hybrid</option>
            </select>
          </div>
        </div>
  
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Usage Type</label>
            <select class="form-select">
              <option selected disabled>Select</option>
              <option>Personal</option>
              <option>Commercial</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Anti-theft Device Installed?</label>
            <select class="form-select">
              <option selected disabled>Select</option>
              <option>Yes</option>
              <option>No</option>
            </select>
          </div>
        </div>
  
        <div class="d-flex justify-content-between mt-4">
          <button class="btn btn-outline-secondary px-4">← Back</button>
          <button class="btn btn-primary px-4">Next →</button>
        </div>
      </form>
    </div>
  </div>
