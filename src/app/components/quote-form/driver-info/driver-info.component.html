<div class="driver-info-container">
  <h3 class="fw-bold text-center mb-4 text-primary">Step 2: Driver Information</h3>

  <form>
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">License Number</label>
        <input type="text" class="form-control" placeholder="DL-0420210001234">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">License State</label>
        <select class="form-select">
          <option selected disabled>Select State</option>
          <option>Maharashtra</option>
          <option>Karnataka</option>
          <option>Delhi</option>
          <option>Tamil Nadu</option>
          <option>Uttar Pradesh</option>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Years of Experience</label>
        <input type="number" class="form-control" placeholder="5">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Any accidents or claims in the last 5 years?</label>
        <select class="form-select">
          <option selected disabled>Select</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Gender</label>
        <select class="form-select">
          <option selected disabled>Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Marital Status</label>
        <select class="form-select">
          <option selected disabled>Select</option>
          <option>Single</option>
          <option>Married</option>
          <option>Divorced</option>
          <option>Widowed</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">Education Level</label>
      <select class="form-select">
        <option selected disabled>Select</option>
        <option>High School</option>
        <option>Diploma</option>
        <option>Graduate</option>
        <option>Postgraduate</option>
      </select>
    </div>
  </form>
</div>
