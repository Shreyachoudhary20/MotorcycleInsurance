<div class="container mt-5">
  <ul class="nav nav-tabs justify-content-center mb-4">
    <li class="nav-item" *ngFor="let step of ['Customer', 'Driver', 'Motorcycle', 'Coverage']; let i = index">
      <a class="nav-link" [class.active]="stepIndex === i" (click)="goToStep(i)" style="cursor: pointer;">
        {{ step }}
      </a>
    </li>
  </ul>

  <div *ngIf="stepIndex === 0"><app-customer-info></app-customer-info></div>
  <div *ngIf="stepIndex === 1"><app-driver-info></app-driver-info></div>
  <div *ngIf="stepIndex === 2"><app-motorcycle-info></app-motorcycle-info></div>
  <div *ngIf="stepIndex === 3"><app-coverage-info></app-coverage-info></div>
  <div *ngIf="stepIndex === 4"><app-confirmation-summary></app-confirmation-summary></div>

  <div class="d-flex justify-content-between mt-4">
    <button class="btn btn-outline-secondary" (click)="prevStep()" [disabled]="stepIndex === 0">← Back</button>
    <button class="btn btn-primary" (click)="nextStep()" [disabled]="stepIndex === 3">Next →</button>
  </div>
</div>
