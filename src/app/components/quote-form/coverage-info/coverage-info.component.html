<div class="container mt-5">
    <div class="card shadow p-4 border-0 rounded-4">
      <h3 class="fw-bold text-center mb-4 text-primary">Step 4: Coverage Details</h3>
  
      <form>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Coverage Type</label>
            <select class="form-select">
              <option selected disabled>Select</option>
              <option>Comprehensive</option>
              <option>Third-party</option>
              <option>Personal Accident</option>
            </select>
          </div>
  
          <div class="col-md-6">
            <label class="form-label fw-semibold">Policy Start Date</label>
            <input type="date" class="form-control">
          </div>
        </div>
  
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Policy Duration</label>
            <select class="form-select">
              <option selected disabled>Select Duration</option>
              <option>1 Year</option>
              <option>3 Years</option>
            </select>
          </div>
  
          <div class="col-md-6">
            <label class="form-label fw-semibold">Preferred Insurer</label>
            <select class="form-select">
              <option selected disabled>Select Insurer</option>
              <option>HDFC Ergo</option>
              <option>ICICI Lombard</option>
              <option>Bajaj Allianz</option>
              <option>SBI General</option>
            </select>
          </div>
        </div>
  
        <div class="mb-3">
          <label class="form-label fw-semibold">Add-on Covers</label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="zeroDep">
            <label class="form-check-label" for="zeroDep">Zero Depreciation</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rsa">
            <label class="form-check-label" for="rsa">Roadside Assistance</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="engineProtect">
            <label class="form-check-label" for="engineProtect">Engine Protection</label>
          </div>
        </div>
  
        <div class="mb-4">
            <label class="form-label fw-semibold">Estimated Premium</label>
            <input type="text" class="form-control bg-light" value="₹2,700" disabled>
          </div>
          
        <div class="d-flex justify-content-between mt-4">
          <button class="btn btn-outline-secondary px-4">← Back</button>
          <button class="btn btn-success px-4">Submit &rarr;</button>
        </div>
      </form>
    </div>
  </div>
