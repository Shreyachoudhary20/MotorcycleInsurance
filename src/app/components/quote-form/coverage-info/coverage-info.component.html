<div class="coverage-container">
  <h3 class="fw-bold text-center mb-4 text-primary">Step 4: Coverage Details</h3>

  <form>
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Coverage Type</label>
        <select class="form-select" [(ngModel)]="coverage.coverageType" name="coverageType" (change)="calculatePremium()">
          <option selected disabled>Select</option>
          <option>Comprehensive</option>
          <option>Third-party</option>
          <option>Personal Accident</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Policy Start Date</label>
        <input type="date" class="form-control" [(ngModel)]="coverage.startDate" name="startDate">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Policy Duration</label>
        <select class="form-select" [(ngModel)]="coverage.duration" name="duration" (change)="calculatePremium()">
          <option selected disabled>Select Duration</option>
          <option>1 Year</option>
          <option>3 Years</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Preferred Insurer</label>
        <select class="form-select" [(ngModel)]="coverage.insurer" name="insurer">
          <option selected disabled>Select Insurer</option>
          <option>HDFC Ergo</option>
          <option>ICICI Lombard</option>
          <option>Bajaj Allianz</option>
          <option>SBI General</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Add-on Covers</label>
      <div class="form-check" *ngFor="let addon of addonCovers">
        <input class="form-check-input" type="checkbox" [id]="addon.id" [(ngModel)]="addon.selected" [name]="addon.id" (change)="calculatePremium()">
        <label class="form-check-label" [for]="addon.id">{{ addon.label }}</label>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">Estimated Premium</label>
      <input type="text" class="form-control bg-light" [value]="'₹' + estimatedPremium" disabled>
    </div>
  </form>
</div>
