<div class="customer-info-wrapper animate__animated animate__fadeInUp">
  <h5 class="info-title">Step 1: Customer Information</h5>
  <form>
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-control" placeholder="Enter first name">
      </div>
      <div class="col-md-6">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-control" placeholder="Enter last name">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email address">
      </div>
      <div class="col-md-6">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" id="phone" class="form-control" placeholder="Enter phone number">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" id="dob" class="form-control">
      </div>
      <div class="col-md-6">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" class="form-control" placeholder="Street address">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" class="form-control" placeholder="Enter city">
      </div>
      <div class="col-md-6">
        <label for="state" class="form-label">State</label>
        <select id="state" class="form-select">
          <option selected disabled>Select state</option>
          <option>Maharashtra</option>
          <option>Delhi</option>
          <option>Karnataka</option>
          <option>Tamil Nadu</option>
          <option>Uttar Pradesh</option>
        </select>
      </div>
    </div>
  </form>
</div>
