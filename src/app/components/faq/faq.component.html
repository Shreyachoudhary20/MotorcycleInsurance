<section class="faq-section py-5" id="faq">
    <div class="container">
      <h2 class="text-center mb-4">Frequently Asked Questions</h2>
      <div class="accordion" id="faqAccordion">
        <div class="accordion-item" *ngFor="let faq of faqs; let i = index">
          <h2 class="accordion-header" [id]="'heading' + i">
            <button class="accordion-button d-flex justify-content-between align-items-center"
                    [class.collapsed]="activeIndex !== i"
                    type="button"
                    data-bs-toggle="collapse"
                    [attr.data-bs-target]="'#collapse' + i"
                    [attr.aria-expanded]="activeIndex === i ? 'true' : 'false'"
                    [attr.aria-controls]="'collapse' + i"
                    (click)="toggle(i)">
              {{ faq.question }}
              <span class="arrow-icon ms-auto" [class.rotate]="activeIndex === i">&#9662;</span>
            </button>
          </h2>
          <div [id]="'collapse' + i"
               class="accordion-collapse collapse"
               [class.show]="activeIndex === i"
               [attr.aria-labelledby]="'heading' + i"
               data-bs-parent="#faqAccordion">
            <div class="accordion-body">
              {{ faq.answer }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
